# Hooks run on commit. Install with: pre-commit install
#
# Every hook is scoped to the paths we actively maintain (BenNevis/, tests/ and
# top-level config). egs/ holds recipes, shell, Perl and large .ctm reference
# data that predate these conventions; sweeping them now would bury real
# changes under whitespace churn. This also keeps
#   pre-commit run --all-files
# safe to run at any time.
#
# Only fast, local checks belong here. Tests run in CI, not on commit.
default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: ^(BenNevis/|tests/|[^/]+\.(py|toml|cfg|yaml|yml|md))$
        exclude: ^tests/golden/
      - id: end-of-file-fixer
        files: ^(BenNevis/|tests/|[^/]+\.(py|toml|cfg|yaml|yml|md))$
        exclude: ^tests/golden/
      - id: check-yaml
        files: ^(\.github/|[^/]+\.(yaml|yml)|\.pre-commit-config\.yaml)
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
        # The guard is against a binary landing in the source tree by
        # accident. Two places hold large files on purpose:
        #   egs/ -- corpora and language models a recipe downloads.
        #   tests/golden/reference/ -- captured Kaldi output, which is the
        #     whole point of it. mini-librispeech's feature arrays, 200k-word
        #     symbol table and 200k-entry lexicon are all over a megabyte,
        #     and the alternative to committing them is a reference that
        #     exists only as a 90-day workflow artefact while Kaldi rots.
        #     The FSTs, which would be 590MB, are digests rather than bytes.
        exclude: ^(egs/|tests/golden/reference/)

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      # `egs/` is here because a recipe can hold Python now. pre-commit
      # passes the staged paths rather than a directory, so this cannot
      # traverse the recipe symlinks the way `black egs/` does -- see the
      # comment on CI's black step and
      # tests/recipes/test_linted_recipes.py.
      - id: black
        args: [--line-length=88]
        files: ^(BenNevis/|tests/|egs/)

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      # Scoped to tests/ and egs/ to match CI: BenNevis/ has never been
      # isorted and gets its own deliberate PR.
      - id: isort
        args: [--profile=black, --line-length=88]
        files: ^(tests/|egs/)

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        files: ^(BenNevis/|tests/|egs/)
