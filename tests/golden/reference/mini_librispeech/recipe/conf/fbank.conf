--sample-frequency=16000
--num-mel-bins=80
# Zero, not Kaldi's default of 1.0. Dither adds random noise to the
# waveform, and although Kaldi's generator makes it reproducible for
# Kaldi, no other implementation can match it -- which makes the
# features impossible to reproduce outside Kaldi and so impossible to
# replace bit-exactly. It exists to avoid log(0) on digital silence,
# which Kaldi already handles by flooring the mel energies at float
# epsilon before taking the log.
--dither=0
