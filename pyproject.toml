[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "BenNevis"
version = "0.1.0"
description = "End-to-End ASR toolkit based on Differentiable Weighted Finite-State Transducer (DWFST)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "Zeyu Zhao", email = "zeyuhongwu1995@gmail.com"}
]
keywords = ["speech-recognition", "asr", "wfst", "k2", "pytorch", "deep-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "tqdm>=4.65.0",
    "hydra-core>=1.3.0",
    "wandb>=0.15.0",
    "torchinfo>=1.8.0",
    "kaldiio>=2.18.0",
]

[project.optional-dependencies]
whisper = [
    "openai-whisper>=20230314",
]
transformers = [
    "transformers>=4.30.0",
    "datasets>=2.12.0",
]
audio = [
    "numba>=0.57.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
    "mypy>=1.4.0",
    "pre-commit>=3.3.0",
    "isort>=5.12.0",
]
all = [
    "BenNevis[whisper,transformers,audio,dev]",
]

[project.urls]
Homepage = "https://github.com/zeyuzhao/BenNevis"
Repository = "https://github.com/zeyuzhao/BenNevis"
"Bug Tracker" = "https://github.com/zeyuzhao/BenNevis/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["BenNevis*"]
exclude = ["tests*", "egs*", "tools*"]

[tool.black]
line-length = 120
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=BenNevis --cov-report=term-missing --cov-report=html"
