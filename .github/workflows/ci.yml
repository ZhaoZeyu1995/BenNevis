name: CI

on:
  push:
    branches: [master]
  # Every pull request, not only those targeting master. Stacked PRs -- one
  # based on another that has not merged yet -- would otherwise get no checks
  # at all, which is precisely when they are most wanted.
  pull_request:

# A new push to a PR cancels the previous run rather than queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Pinned exactly, and kept in step with the revs in
      # .pre-commit-config.yaml. Unpinned linters mean a new release can turn
      # CI red without a code change, and black's style evolves between
      # releases. Upgrading is a deliberate change, made in its own PR.
      - name: Install linters
        run: pip install black==24.10.0 isort==5.13.2 flake8==7.1.1
      - name: black
        run: black --check --diff --line-length=88 BenNevis/ tests/
      # Scoped to tests/ for now: BenNevis/ has never been isorted, and doing it
      # here would bury this change under an import reshuffle of the whole
      # package. It gets its own deliberate PR.
      - name: isort
        run: isort --check --diff --profile=black --line-length=88 tests/
      - name: flake8
        run: flake8 BenNevis/ tests/

  # Tier 1: no k2, no Kaldi, no GPU. Runs on every push and must stay fast.
  # These tests import nothing heavier than the standard library, so they need
  # no dependencies at all.
  test-tier1:
    name: Tier 1 tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # The Python version is swept on Linux, where it is cheapest, and the
      # other two platforms are covered at a single version. Sweeping both
      # axes would be twelve jobs to catch almost nothing: a version-specific
      # break is rarely also platform-specific.
      #
      # 3.8 and 3.9 are both end-of-life and no longer available on current
      # GitHub runners. The floor is whatever torch and k2 publish wheels for.
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # pyyaml alongside pytest: the topology specs are YAML, and it is a
      # small wheel with no transitive dependencies, so this tier stays
      # instant. See the tier table in CLAUDE.md.
      - name: Install test dependencies
        run: pip install pytest pyyaml
      - name: Run tier 1
        run: pytest tests/ -v -m "not torch and not k2 and not kaldi and not gpu"

  # Tier 1b: needs torch, but still no k2, no Kaldi and no GPU. Split from
  # tier 1 so that the dependency-free tests stay instant and cannot be held
  # up by a ~200MB wheel download.
  test-torch:
    name: Tier 1b tests (torch, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # CPU torch first, so installing the package does not pull the much
      # larger CUDA build from PyPI. The rest comes from pyproject's declared
      # dependencies rather than a list maintained separately here; k2 is not
      # among them and is not needed, because nothing in this tier imports it.
      #
      # The CPU index carries no macOS wheels, because the macOS build has no
      # CUDA variant to distinguish it from; PyPI's default wheel is already
      # the right one there.
      - name: Install torch (CPU) and the package
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            pip install torch torchaudio
          else
            pip install torch torchaudio \
              --index-url https://download.pytorch.org/whl/cpu
          fi
          pip install -e .
          pip install pytest
      - name: Run tier 1b
        run: pytest tests/ -v -m "torch and not k2 and not kaldi and not gpu"

  # Tier 2: adds k2. Its wheels are built against an exact torch version and
  # come from k2's own index, not PyPI, so both are pinned together here and
  # must be bumped together. Still CPU-only and still free.
  test-k2:
    name: Tier 2 tests (k2, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # k2 publishes cp312 CPU wheels for all three platforms at this exact
      # torch version -- manylinux x86_64, macosx_11_0_arm64 and win_amd64 --
      # so the FST tier is not Linux-only. Check the index before bumping the
      # pin: a newer build may not cover every platform on the day.
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install torch (CPU) pinned to the k2 wheel
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            pip install torch==2.15.0 torchaudio
          else
            pip install torch==2.15.0 torchaudio \
              --index-url https://download.pytorch.org/whl/cpu
          fi
      # `shell: bash` because the Windows runner defaults to PowerShell, which
      # does not accept a backslash line continuation.
      - name: Install k2 (CPU wheel matching torch 2.15.0)
        shell: bash
        run: |
          pip install k2==1.24.4.dev20261112+cpu.torch2.15.0 \
            --find-links https://k2-fsa.github.io/k2/cpu.html
      - name: Install the package
        run: |
          pip install -e .
          pip install pytest
      - name: Run tier 2
        run: pytest tests/ -v -m "k2 and not kaldi and not gpu"

  package:
    name: Package builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tooling
        run: pip install build twine
      - name: Build
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
