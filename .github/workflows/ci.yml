name: CI

on:
  push:
    branches: [ master, dev, devel ]
  pull_request:
    branches: [ master, dev, devel ]

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 isort mypy

    - name: Run black
      run: black --check --diff --line-length=120 BenNevis/

    - name: Run isort
      run: isort --check --diff --profile=black --line-length=120 BenNevis/

    - name: Run flake8
      run: flake8 BenNevis/ --max-line-length=120 --extend-ignore=E203,W503

  base-test:
    name: Base Tests (no k2) on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
        pip install pytest pytest-cov
        pip install tqdm hydra-core wandb torchinfo kaldiio

    - name: Install BenNevis
      run: |
        pip install -e .

    - name: Run base tests
      run: |
        pytest tests/ -v -m "not k2" --cov=BenNevis --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      if: matrix.python-version == '3.9'
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  k2-test:
    name: k2 Tests on Python 3.9
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch==2.1.0 torchvision==0.16.0 torchaudio==2.1.0 --index-url https://download.pytorch.org/whl/cpu
        pip install pytest pytest-cov
        pip install tqdm hydra-core wandb torchinfo kaldiio

    - name: Install k2 (CPU wheel matching torch 2.1.0)
      run: |
        pip install k2==1.24.4.dev20231220+cpu.torch2.1.0 -f https://k2-fsa.github.io/k2/cpu.html

    - name: Install BenNevis
      run: |
        pip install -e .

    - name: Run k2 tests
      run: |
        pytest tests/ -v -m "k2"

  package:
    name: Check Package Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*
