name: Recipe tier (nightly)

# Tier 3: the only tier that runs a recipe, and so the only coverage the
# entry-point scripts have -- run/train.py, run/predict.py, bin/align.py and
# the shell wrappers around them are reachable from no other tier.
#
# It needs Kaldi, so it runs inside the image docker/Dockerfile builds. Not
# on pushes: a yesno run is about an hour, and the image may not exist for a
# pull request from a fork.
on:
  schedule:
    # 03:00 UTC, which is off-peak for the shared runner pool.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      topos:
        description: "Topologies to run, space separated. Blank means all."
        required: false
        default: ""
      max_epochs:
        description: "Override trainer.max_epochs, e.g. 5 for a quick check."
        required: false
        default: ""
      stage:
        description: "First recipe stage to run. Blank means from the start."
        required: false
        default: ""
      stop_stage:
        description: "Last recipe stage to run. Blank means to the end."
        required: false
        default: ""
      recipe:
        description: >-
          Which recipe to run, as a path under egs/. The scheduled run is
          always yesno; mini_librispeech is for a dispatch, and its stages 5
          and up take hours, so pair it with stop_stage 4 unless you mean to
          train.
        required: false
        default: egs/yesno/asr
        type: choice
        options:
          - egs/yesno/asr
          - egs/mini_librispeech/asr

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # The scheduled run has no inputs, so it falls back to yesno here.
  RECIPE: ${{ github.event.inputs.recipe || 'egs/yesno/asr' }}

jobs:
  recipe:
    name: recipe end to end
    runs-on: ubuntu-latest
    # Eight topologies at eighty epochs each, plus feature extraction, graph
    # compilation, decoding and alignment. Well under the six-hour ceiling,
    # but far enough above the expected hour that a slow day is not mistaken
    # for a hang.
    timeout-minutes: 300
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # The capture needs to know the corpus name it writes under and which
      # data directories to read, and those differ per recipe. Kept here
      # rather than guessed inside capture.py, so adding a recipe is an
      # explicit edit in one place.
      - name: Work out the capture arguments
        run: |
          # One line per value: $GITHUB_ENV takes KEY=value and nothing
          # else, so a backslash continuation inside the quotes writes a
          # second line and the whole step fails with "Unable to process
          # file command 'env'". Long lines are the lesser evil.
          case "${RECIPE}" in
            egs/yesno/asr)
              args='--corpus yesno --model rnnp --test-set test_yesno --datasets train_yesno test_yesno' ;;
            egs/mini_librispeech/asr)
              args='--corpus mini_librispeech --model rnnp --test-set dev_clean_2 --datasets train_clean_5 dev_clean_2 --lang-dir data/lang_nosp --graph-prefix data/lang_test_tgsmall_ --dict-dir data/local/dict_nosp --tmp-dir data/local/lang_tmp_nosp' ;;
            *)
              echo "no capture arguments for ${RECIPE}" >&2; exit 1 ;;
          esac
          echo "CAPTURE_ARGS=${args}" >> "$GITHUB_ENV"
          echo "capture arguments: ${args}"

      - name: Work out the image name
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${owner}/bennevis-kaldi:latest" >> "$GITHUB_ENV"

      # The package is private unless it has been made public, so this is
      # needed even though the repository is public.
      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Created here, as the runner, before any container writes into the
      # workspace. The capture step runs as root in Docker and used to create
      # this directory itself, after which the host-side tar below could not
      # write into it -- and its `|| true` swallowed the permission error, so
      # the scores artefact uploaded empty while the job reported success.
      - name: Make the artefact directory
        run: mkdir -p artefacts/reference

      - name: Pull the Kaldi image
        run: |
          docker pull "$IMAGE"
          # The digest, not the tag, is what goes in the capture manifest: a
          # reference whose provenance is unknown is not a reference.
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          echo "IMAGE_DIGEST=${digest}" >> "$GITHUB_ENV"
          echo "pulled ${digest}"

      # Both recipes fetch their corpus from openslr, and both skip the
      # fetch when the data is already in the tree, so a cache turns a
      # download into a restore. The keys carry a hand-written version
      # because a cache hit is never re-saved: a corpus that changes
      # upstream needs a new key, not a new run.
      - name: Restore the yesno corpus
        if: env.RECIPE == 'egs/yesno/asr'
        uses: actions/cache@v4
        with:
          path: egs/yesno/asr/waves_yesno
          key: waves-yesno-v1

      # mini-librispeech fetches 1.2GiB: 120MiB of dev-clean-2, 318MiB of
      # train-clean-5, and 777MiB of language models of which 724MiB is the
      # unpruned 3-gram that `download_lm.sh` insists on and this recipe
      # never decodes with. That is eight minutes on a good day, and all of
      # it again on a retry -- which is what cost run 45202289714 its whole
      # two and a half hours when the runner was lost at 56% of the 3-gram.
      # An earlier comment here put the corpus at 500MB and called it too
      # big for the cache budget; it is 1.2GiB against a 10GB budget, so
      # that was wrong on both halves.
      #
      # The archives are excluded deliberately. `download_and_untar.sh`
      # returns on `LibriSpeech/<part>/.complete` before it so much as
      # looks for the tarball, so the extracted audio suffices by itself
      # and caching the archives beside it would store the same FLAC twice.
      # The language models are cached as the gzipped files they arrive as,
      # because `download_lm.sh` compares each one against an expected byte
      # count and re-downloads anything that does not match.
      - name: Restore the mini-librispeech corpus and language models
        id: mini-librispeech-corpus
        if: env.RECIPE == 'egs/mini_librispeech/asr'
        uses: actions/cache/restore@v4
        with:
          path: |
            egs/mini_librispeech/asr/corpus
            !egs/mini_librispeech/asr/corpus/*.tar.gz
          key: mini-librispeech-corpus-v1

      # Two things keep this step's output readable, because the job log
      # is capped at about 2MB and a recipe can print far more than that.
      #
      # WGETRC coarsens wget's progress meter from a line per 50KiB to a
      # line per 50MiB; see .github/wgetrc. And the whole output is tee'd
      # to a file that is uploaded as an artefact, so the cap can never
      # again hide what the recipe did -- which is exactly what it did on
      # run 45202289714, where three hours of recipe were unreadable and
      # "still training" could not be told from "hung". The job log keeps
      # the live view; the artefact keeps everything, Kaldi's per-file
      # `tar -xvzf` chatter included.
      #
      # `tee` and not a redirect, so the log still streams while the
      # recipe runs. `pipefail` is set above, so a failing recipe still
      # fails the step.
      - name: Run the recipe
        env:
          TOPOS: ${{ github.event.inputs.topos }}
          MAX_EPOCHS: ${{ github.event.inputs.max_epochs }}
          STAGE: ${{ github.event.inputs.stage }}
          STOP_STAGE: ${{ github.event.inputs.stop_stage }}
        run: |
          set -euo pipefail
          opts=()
          if [ -n "${TOPOS}" ]; then
            opts+=(--topos "${TOPOS}")
          fi
          if [ -n "${MAX_EPOCHS}" ]; then
            opts+=(--hydra_opts "trainer.max_epochs=${MAX_EPOCHS}")
          fi
          # Resuming only makes sense when the earlier stages' output is
          # still in the workspace, which on a fresh runner it is not --
          # so these are for a dispatch against a cached or restored tree,
          # not for the scheduled run.
          if [ -n "${STAGE}" ]; then
            opts+=(--stage "${STAGE}")
          fi
          if [ -n "${STOP_STAGE}" ]; then
            opts+=(--stop_stage "${STOP_STAGE}")
          fi
          docker run --rm \
            -v "$PWD:/workspace" \
            -w "/workspace/${RECIPE}" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace \
            -e WANDB_MODE=disabled \
            -e OMP_NUM_THREADS=1 \
            -e WGETRC=/workspace/.github/wgetrc \
            "$IMAGE" \
            ./run.sh "${opts[@]}" 2>&1 | tee artefacts/recipe.log

      # Saved by hand, and on failure too. `actions/cache` is
      # `post-if: success()`, so a job that dies after the download has
      # finished saves nothing and the next attempt fetches the 1.2GiB
      # again -- which is the case the cache exists for, since a recipe
      # that breaks in training has already paid for the corpus. Placed
      # after the recipe rather than at the end of the job so that a
      # failing recipe still gets here; nothing can be saved when the
      # runner itself is lost, which is a limit of the mechanism rather
      # than of where this sits. yesno keeps the combined action because
      # re-fetching 4.7MB is not worth a second step.
      #
      # The recipe runs in Docker and so writes `corpus/` as root. This
      # step only reads it, so it is not the permission trap the artefact
      # directory was.
      - name: Save the mini-librispeech corpus and language models
        if: >-
          always() && env.RECIPE == 'egs/mini_librispeech/asr'
          && steps.mini-librispeech-corpus.outputs.cache-hit != 'true'
        # A cache is an optimisation and must never be why a job is red.
        # With `always()` this step also runs when an earlier one failed,
        # and `cache/save` rejects a path that does not exist -- so a job
        # that died before the download would otherwise report a second,
        # unrelated failure on the way out.
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            egs/mini_librispeech/asr/corpus
            !egs/mini_librispeech/asr/corpus/*.tar.gz
          key: mini-librispeech-corpus-v1

      # PYTHONPATH, because the image deliberately does not install
      # BenNevis: the point is to test the mounted tree. The recipe gets this
      # from tools/env.sh; a bare pytest run does not.
      - name: Check what the recipe produced
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace \
            "$IMAGE" \
            pytest tests/ -v -m kaldi

      # Capture what Kaldi produced, for the reference data the Kaldi
      # removal will be measured against. Run even when the checks above
      # failed: a WER that drifted does not make the symbol tables and
      # lexicon FSTs less worth recording, and Kaldi's build is rotting
      # fast enough that a capture missed is a capture that may not be
      # obtainable later.
      - name: Capture the Kaldi reference
        if: always()
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace \
            -e BENNEVIS_IMAGE="${IMAGE_DIGEST:-$IMAGE}" \
            "$IMAGE" \
            python3 tests/reference/capture.py \
              "${RECIPE}" /workspace/artefacts/reference ${CAPTURE_ARGS}

      - name: Upload the Kaldi reference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaldi-reference
          path: artefacts/reference
          if-no-files-found: warn
          retention-days: 90

      # Always, not only on failure: the measured error rates are how the
      # ledger in tests/golden/wer/yesno.json gets tightened, and they are
      # worth having from a passing run too.
      - name: Collect the scores and logs
        if: always()
        run: |
          set -o pipefail
          cd "${RECIPE}"
          find exp \( -name 'results.wrd.txt' -o -name 'hyp.wrd.trn' \
               -o -name 'ref.wrd.trn' -o -name '*.log' \) -print \
               > "${RUNNER_TEMP}/scores.list" || true
          cd ../../..
          # Reported rather than ignored. An empty list is legitimate when
          # the recipe failed before decoding, so it is not an error -- but
          # it is said out loud, because "the artefact is empty" and "the
          # step could not write" used to look identical.
          count=$(wc -l < "${RUNNER_TEMP}/scores.list" | tr -d ' ')
          echo "collecting ${count} score and log file(s)"
          if [ "${count}" -gt 0 ]; then
            tar czf artefacts/yesno-scores.tar.gz \
                -C "${RECIPE}" -T "${RUNNER_TEMP}/scores.list"
          fi
          # Two decoders now, so the table says which produced each row.
          # The Kaldi path writes sclite's table and the k2 path writes one
          # line from BenNevis.utils.scoring, so both formats are read --
          # a row saying "unknown" means the file was there and
          # unparseable, which is worth telling apart from no row at all.
          rows=0
          unparsed=0
          {
            echo "## ${RECIPE} error rates"
            echo
            echo '| topology | decoder | WER |'
            echo '| --- | --- | --- |'
            for d in "${RECIPE}"/exp/*/dec_*/aw_*/results.wrd.txt; do
              [ -f "$d" ] || continue
              topo=$(echo "$d" | sed -E 's|.*/exp/rnnp-([^/]*)/.*|\1|')
              case "$d" in
                *dec_k2_*) who=k2 ;;
                *)         who=kaldi ;;
              esac
              # awk rather than `grep | awk`: this step sets pipefail and
              # the shell is `bash -e`, so a grep that finds nothing fails
              # the pipeline and aborts the step. That is exactly what
              # happened once the k2 files appeared -- they are not sclite
              # format, so the grep matched nothing and a successful recipe
              # reported failure. awk treats no-match as empty output
              # rather than as an error, which is what is wanted here.
              #
              # Field NF-2 is sclite's Err column. The row is
              #   | Sum/Avg|  29  232 | 99.6  0.0  0.4  0.0  0.4  3.4 |
              # whose last three fields are Err, S.Err and a bar -- so
              # NF-1 would be the *sentence* error rate, which is a much
              # larger number and looks plausible.
              wer=$(awk '/\| *Sum\/Avg/ {print $(NF-2); exit}' "$d")
              if [ -z "$wer" ]; then
                wer=$(sed -nE 's/^WER ([0-9.]+)%.*/\1/p' "$d" | head -1)
              fi
              if [ -z "$wer" ]; then
                unparsed=$((unparsed + 1))
              fi
              rows=$((rows + 1))
              echo "| $topo | $who | ${wer:-unknown} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          # Said out loud rather than left to the table, for the same
          # reason the file count above is: "no rows" and "the step could
          # not read them" used to look identical.
          echo "summarised ${rows} result file(s), ${unparsed} unparseable"


      - name: Upload the scores and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yesno-scores
          # recipe.log beside the scores rather than in its own artefact:
          # it is the same question -- what did this run do -- and a
          # second upload would be a second place to forget.
          path: |
            artefacts/yesno-scores.tar.gz
            artefacts/recipe.log
          if-no-files-found: warn
          retention-days: 30
