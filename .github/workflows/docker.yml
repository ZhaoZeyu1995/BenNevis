name: Docker image

# The Kaldi-dependent test tier needs Kaldi, which this image derives from
# the Kaldi project's own prebuilt one. Built only when its own definition
# changes; the nightly recipe job pulls the published result.
on:
  push:
    branches: [master]
    paths:
      - docker/**
      - pyproject.toml
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - docker/**
      - pyproject.toml
      - .github/workflows/docker.yml
  # So that the image can be rebuilt without a code change: a base image
  # security update, or a pinned wheel being yanked.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the Kaldi image
    runs-on: ubuntu-latest
    # Kaldi arrives prebuilt, so this is a pull plus a pip install. The
    # ceiling allows for a slow registry without letting a hang run for
    # hours.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # A registry repository name must be lowercase, and this account's
      # owner name is not, so it cannot be interpolated directly. Computed
      # rather than hardcoded so that a fork publishes under its own owner.
      - name: Work out the image name
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${owner}/bennevis-kaldi" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      # Only on master: a pull request from a fork has no write access to the
      # registry, and a PR does not need a published image -- building it is
      # the check.
      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          # Linux amd64 only; see the comment at the top of the Dockerfile.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # No build cache, which is a change from `type=gha,mode=max`
          # and was decided on measurement rather than principle. From the
          # 21 November build, layer by layer:
          #
          #   #6   67.6s   pulling the Kaldi base image
          #   #8   16.4s   apt-get
          #   #9    2.6s   python3 -m venv
          #   #10  27.6s   pip install torch, torchaudio, k2
          #   #13  11.1s   pip install the pyproject dependencies
          #   #17  56.5s   exporting and pushing the image
          #   #19 209.9s   exporting to the GitHub Actions cache
          #
          # Everything a cache could save is #8 to #13, which is 58
          # seconds. The export cost 209.9 -- three and a half minutes of
          # every build to avoid one -- and the Actions cache is scoped per
          # branch, so a pull request touching docker/ paid that again for
          # a copy master could never read. The two copies held 5.22GiB,
          # 88% of everything cached for this repository, against a 10GB
          # budget the nightly's corpus caches now want. A warm export on
          # the same branch would be cheaper than 209.9s; the 5.22GiB is
          # unconditional.
          #
          # Dropping it makes the build about 2m39s rather than 6m09s. The
          # base image still comes from Docker Hub by digest, which is the
          # #6 above and is not something a cache was shortening.

      - name: Check the image has what the recipes need
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            "${IMAGE}:${{ github.sha }}" \
            bash docker/smoke.sh

      - name: Check the entrypoint links a mounted tree
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            "${IMAGE}:${{ github.sha }}" \
            bash -c '
              set -e
              test -L tools/kaldi
              test -L tools/venv
              test -x tools/kaldi/src/featbin/compute-fbank-feats
              test -x tools/venv/bin/python3
              echo "entrypoint: links in place"
            '

      - name: Report the image size
        run: docker image ls "${IMAGE}" || true
